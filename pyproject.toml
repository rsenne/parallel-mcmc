[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-mcmc"
version = "0.1"
description = "Differentiable, parallel-in-time particle filters (twisted DEER + windowed Gumbel-STE resampling)"
requires-python = ">=3.11"
readme = "README.md"
license = {file="LICENSE"}
dependencies = [
    "jax",
    "optax",
    "numpy",
    "scipy",
    "matplotlib",
    "jaxtyping"
]
authors = [
    {name="David Zoltowski"}, 
    {name="Skyler Wu"}, 
    {name="Xavier Gonzalez"}, 
    {name="Leo Kozachkov"}, 
    {name="Scott Linderman"}
]
maintainers = [
    {name="David Zoltowski", email="dzoltow@stanford.edu"},
]

[project.urls]
repository = "https://github.com/lindermanlab/parallel-mcmc"
homepage = "https://github.com/lindermanlab/parallel-mcmc"

[tool.setuptools.packages.find]
where = ["."]
